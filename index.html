<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pictograms</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg1:#4facfe;--bg2:#00c6ff;--ink:#17324f;--hot:#ff9f1c;--ok:#2ec27e;--bad:#ef476f;
--font:'Lilita One','Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));}
button{font-family:inherit;cursor:pointer;border:0}
#app{height:100%;display:flex;flex-direction:column;gap:1vmin;padding:1.2vmin;position:relative}
.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:1.2vmin}
.screen.on{display:flex}

/* ---------- splash / levels ---------- */
#splash{align-items:center;justify-content:center;text-align:center;gap:2.2vmin;padding-bottom:5vmin;position:relative;overflow:hidden}
#splash>*:not(.drift){position:relative;z-index:2}
.drift{position:absolute;bottom:-12vmin;z-index:1;opacity:.55;pointer-events:none;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-125vh) rotate(40deg)}}
.sp-title{font-size:clamp(2.6rem,12vmin,6.4rem);color:#fff;line-height:1;text-shadow:0 .8vmin 0 rgba(0,0,0,.18)}
.sp-title span{display:inline-block;animation:bob 2.2s ease-in-out infinite}
.sp-sub{font-size:clamp(1.1rem,3.8vmin,2.1rem);color:#fff;max-width:30em;line-height:1.25;text-wrap:balance;text-shadow:0 .4vmin 0 rgba(0,0,0,.15)}
.sp-card{background:#fff;border-radius:4vmin;padding:1.6vmin 3vmin 1.2vmin;box-shadow:0 1.2vmin 0 rgba(0,0,0,.18);display:flex;gap:3vmin;align-items:flex-end}
.spc{display:flex;flex-direction:column;align-items:center;gap:.8vmin}
.spb{display:flex;flex-direction:column-reverse;justify-content:flex-start;height:22vmin;width:11vmin;background:#f6fbff;border:.5vmin solid #cfe0f1;border-bottom:.9vmin solid #7a5a2c;border-radius:1.6vmin 1.6vmin 0 0;align-items:center;overflow:hidden}
.spb span{font-size:3.6vmin;line-height:3.8vmin;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.spt{font-size:5vmin;border-radius:99px;padding:0 2vmin;line-height:1.3}
.sp-steps{display:flex;gap:3vmin;color:#fff;font-size:clamp(1rem,3.4vmin,1.9rem)}
.sp-steps b{font-weight:400;background:rgba(255,255,255,.28);border-radius:99px;padding:.2vmin 2.2vmin}
.go-btn{background:#2ec27e;color:#fff;border-radius:99px;padding:1vmin 9vmin;font-size:clamp(1.9rem,8vmin,4rem);box-shadow:0 1.1vmin 0 #1c8a58;animation:pulseBtn 1.6s ease-in-out infinite}
.go-btn:active{transform:translateY(1vmin);box-shadow:0 .1vmin 0 #1c8a58;animation:none}
@keyframes pulseBtn{50%{transform:scale(1.06)}}
.credit{position:absolute!important;left:0;right:0;bottom:1.4vmin;z-index:3;font-size:clamp(.8rem,2.6vmin,1.4rem);color:#fff;letter-spacing:.04em;text-shadow:0 .3vmin 0 rgba(0,0,0,.2)}
#levels{align-items:center;justify-content:center;text-align:center;gap:3vmin;position:relative}
.lvcards{display:flex;gap:3.5vmin;width:min(94vw,860px)}
.lvcard{flex:1;background:#fff;border-radius:4vmin;padding:2.4vmin 1.4vmin;box-shadow:0 1.1vmin 0 rgba(0,0,0,.18);color:var(--ink);font-size:clamp(1.3rem,5.2vmin,2.8rem);transition:transform .12s}
.lvcard:active{transform:translateY(.9vmin);box-shadow:0 .2vmin 0 rgba(0,0,0,.18)}
.lvcard .em{display:block;font-size:clamp(3rem,18vmin,8rem);line-height:1.1;animation:bob 2.4s ease-in-out infinite}
.lvcard small{display:block;font-size:.55em;color:#5b7088;margin-top:.5vmin}
.lvcard:nth-child(1){background:#d9fbe6}.lvcard:nth-child(2){background:#e4e0ff}
.hdr{display:flex;align-items:center;justify-content:center;position:relative;width:min(94vw,980px)}
.hdr .back{position:absolute;left:0;background:#fff}
.hdr .lvb{position:absolute;right:0;margin:0;background:#fff}
/* ---------- menu ---------- */
#menu,#end{align-items:center;justify-content:center;text-align:center;gap:3vmin}
#menu{justify-content:flex-start;overflow-y:auto;gap:2vmin;padding:1vmin 0 3vmin}
.levels{display:flex;gap:2vmin}
.lv{background:rgba(255,255,255,.55);color:var(--ink);border-radius:99px;padding:.6vmin 4vmin;font-size:clamp(1.2rem,5vmin,2.6rem);box-shadow:0 .8vmin 0 rgba(0,0,0,.15)}
.lv.on{background:#fff;outline:.8vmin solid #ffd23f}
.title{font-size:clamp(1.8rem,7.5vmin,4rem);color:#fff;text-shadow:0 .5vmin 0 rgba(0,0,0,.2)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin;width:min(94vw,980px)}
@media (max-width:700px){.themes{grid-template-columns:repeat(3,1fr)}}
.theme{background:#fff;border-radius:3vmin;padding:2vmin .6vmin;font-size:clamp(1rem,3.8vmin,1.9rem);box-shadow:0 1vmin 0 rgba(0,0,0,.18);color:var(--ink);transition:transform .12s}
.theme:active{transform:translateY(.8vmin);box-shadow:0 .2vmin 0 rgba(0,0,0,.18)}
.theme .em{display:block;font-size:clamp(2.2rem,12vmin,6rem);line-height:1.1;animation:bob 2.4s ease-in-out infinite}
.theme:nth-child(2n) .em{animation-delay:-.8s}.theme:nth-child(3n) .em{animation-delay:-1.5s}

/* ---------- top panel ---------- */
#top{display:flex;align-items:center;gap:1.5vmin;background:#fff;border-radius:3vmin;padding:.8vmin 1.6vmin;box-shadow:0 .8vmin 0 rgba(0,0,0,.16);min-height:12vh}
.mini{flex:none;width:clamp(40px,8vmin,64px);height:clamp(40px,8vmin,64px);border-radius:50%;background:#e8f1fb;font-size:clamp(1.3rem,4.6vmin,2.2rem);display:grid;place-items:center;color:var(--ink)}
.mini:active{transform:scale(.92)}
#prompt{flex:1;text-align:center;font-size:clamp(1.5rem,5.8vmin,3.3rem);line-height:1.15;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.25em}
#prompt .em{font-size:1.25em;line-height:1;display:inline-block;filter:drop-shadow(0 .3vmin 0 rgba(0,0,0,.15))}
#prompt .hl{color:var(--bad)}
#prompt .num{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;border-radius:.5em;background:var(--hot);color:#fff;padding:0 .2em}
#prompt.two{font-size:clamp(1.3rem,4.8vmin,2.8rem)}
#prompt .line{width:100%;display:block}
#prompt small{width:100%;font-size:.38em;color:#6b7f95}
#bar{display:flex;justify-content:space-between;align-items:center;gap:2vmin;min-height:4.6vmin}
#dots{display:flex;gap:1.1vmin;align-items:center}
#hud,.hud{display:flex;gap:1.6vmin;background:rgba(255,255,255,.92);border-radius:99px;padding:.2vmin 2vmin;font-size:clamp(1.1rem,4.2vmin,2.2rem)}
.hud span.b{display:inline-block;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.gain{position:fixed;z-index:70;pointer-events:none;font-size:11vmin;animation:rise 1.2s ease-out forwards;filter:drop-shadow(0 .6vmin 0 rgba(0,0,0,.18))}
.dot{width:3.2vmin;height:3.2vmin;min-width:16px;min-height:16px;border-radius:50%;background:rgba(255,255,255,.45);border:.4vmin solid rgba(255,255,255,.9)}
.hud.big{font-size:clamp(2rem,10vmin,5rem);padding:1vmin 4vmin}
.dot.now{background:#fff;transform:scale(1.35);animation:pulse 1s infinite}
.dot.ok{background:var(--ok);border-color:#fff}.dot.retry{background:var(--hot);border-color:#fff}

/* ---------- stage ---------- */
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:#fff;border-radius:3vmin;padding:1.2vmin 1.8vmin 1.2vmin;box-shadow:0 .8vmin 0 rgba(0,0,0,.16);
background-image:linear-gradient(#fff,#fff)}
#cols{flex:1;min-height:0;display:grid;gap:2vmin}
#shead{display:flex;justify-content:space-between;align-items:center;gap:1vmin;margin-bottom:.8vmin;flex-wrap:wrap}
.ptitle{background:#e8f1fb;color:var(--ink);border-radius:99px;padding:.3vmin 2.2vmin;font-size:clamp(1.1rem,4.2vmin,2.3rem)}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:2vmin;transition:opacity .2s,transform .15s;position:relative}
.col.dim{opacity:.38}
.col.pick{cursor:pointer}.col.pick:active{transform:scale(.96)}
.body{flex:1;min-height:0;container-type:size;display:flex;flex-direction:column-reverse;background:#f6fbff;border:.6vmin solid #cfe0f1;border-bottom:0;border-radius:2vmin 2vmin 0 0;position:relative;overflow:hidden;
background-image:repeating-linear-gradient(to top,transparent 0,transparent calc(100%/var(--rows) - 1px),#dbe8f5 calc(100%/var(--rows) - 1px),#dbe8f5 calc(100%/var(--rows)))}
.col.hot .body{border-color:var(--hot);background-color:#fff4dc;box-shadow:0 0 0 .7vmin rgba(255,159,28,.35)}
.col.edit .body{border-color:var(--hot);background-color:#fff9ec}
.col.wrong .body{border-color:var(--bad);background-color:#ffe3e9}
.cell{flex:none;height:calc(100%/var(--rows));display:grid;place-items:center;position:relative;font-size:min(calc(100cqh/var(--rows)*.84),86cqw);line-height:1}
.cell.full span{display:inline-block;animation:pop .28s cubic-bezier(.3,1.6,.5,1) both}
.cell.slot::after{content:"";width:min(calc(100cqh/var(--rows)*.62),60cqw);aspect-ratio:1;border:.5vmin dashed #f2b866;border-radius:50%}
.cell.slot{cursor:pointer}
.cell i{position:absolute;right:4%;bottom:4%;min-width:1.7em;height:1.7em;padding:0 .35em;border-radius:1em;background:var(--ink);color:#fff;font:normal 700 .3em/1.7em var(--font);font-size:max(.3em,12px);text-align:center;animation:pop .25s both;box-shadow:0 0 0 .25em #fff}
.base{height:1.4vmin;min-height:8px;background:#7a5a2c;border-radius:0 0 .5vmin .5vmin}
.tag{margin-top:.7vmin;text-align:center;padding:.2vmin 1vmin;border-radius:99px;line-height:1.3;font-size:clamp(1rem,3.8vmin,2.1rem);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bslot{height:7vmin;display:grid;place-items:center;flex:none}
.bubble{min-width:2em;height:2em;padding:0 .4em;border-radius:1em;background:var(--hot);color:#fff;font-size:clamp(1.1rem,4vmin,2.2rem);line-height:2em;text-align:center;box-shadow:0 .5vmin 0 rgba(0,0,0,.18)}
.lvb{background:#fff;border-radius:99px;padding:0 1.6vmin;font-size:clamp(1rem,3.8vmin,2rem);margin-right:1vmin}
.key{background:#ffd23f;border:.5vmin solid #e09f00;color:#5a3a00;border-radius:99px;padding:.2vmin 2vmin;font-size:clamp(1.1rem,4.2vmin,2.3rem);box-shadow:0 .5vmin 0 rgba(0,0,0,.15)}
.hint{background:var(--ink);color:#fff;border-radius:99px;padding:.3vmin 2vmin;font-size:clamp(.9rem,3vmin,1.6rem);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}

/* ---------- answers ---------- */
#bottom{display:flex;justify-content:center;gap:2.5vmin;min-height:0}
#bottom:empty{display:none}
.ans{flex:1;max-width:30vw;height:14vh;min-height:60px;background:#fff;color:var(--ink);border-radius:3vmin;font-size:clamp(2rem,10vmin,5.5rem);box-shadow:0 1vmin 0 rgba(0,0,0,.2);transition:transform .1s}
.ans:nth-child(1){background:#ffe066}.ans:nth-child(2){background:#9bf6c4}.ans:nth-child(3){background:#ffb3c7}
.ans:active{transform:translateY(.9vmin);box-shadow:0 .1vmin 0 rgba(0,0,0,.2)}
.ans:disabled{opacity:.35;transform:none;box-shadow:none;background:#ddd}
.go{max-width:none;flex:none;width:min(60vw,420px);background:var(--ok)!important;color:#fff}
.ans.shake,.col.shake{animation:shake .4s}

/* ---------- feedback ---------- */
#fb{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:50}
#fb.on{display:grid}
#fb div{text-align:center;background:#fff;border-radius:5vmin;padding:1.5vmin 6vmin;font-size:clamp(2.4rem,12vmin,6rem);color:var(--ok);box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.fall{position:fixed;top:-10vmin;font-size:6vmin;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}

/* ---------- end ---------- */
.score{font-size:clamp(2.4rem,13vmin,7rem);color:#fff;text-shadow:0 .6vmin 0 rgba(0,0,0,.2)}
.big{font-size:clamp(4rem,22vmin,12rem);animation:bob 1.6s ease-in-out infinite}
.btns{display:flex;gap:3vmin}
.btn{background:#fff;color:var(--ink);border-radius:3vmin;padding:1.5vmin 4vmin;font-size:clamp(1.6rem,6vmin,3rem);box-shadow:0 1vmin 0 rgba(0,0,0,.2)}
.btn.g{background:var(--ok);color:#fff}
.btn:active{transform:translateY(.9vmin);box-shadow:none}

@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-1.4vmin)}40%{transform:translateX(1.4vmin)}60%{transform:translateX(-1vmin)}80%{transform:translateX(1vmin)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2vmin)}}
@keyframes pulse{50%{transform:scale(1.6)}}
@keyframes rise{0%{transform:translateY(0) scale(.3);opacity:0}25%{transform:translateY(-6vmin) scale(1.2);opacity:1}100%{transform:translateY(-30vmin) scale(1);opacity:0}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (max-height:520px){#top{min-height:0}.ans{height:20vh}}
</style>
</head>
<body>
<div id="app">

  <section id="splash" class="screen on">
    <div class="sp-title">📊 <span>Pictograms</span></div>
    <div class="sp-sub">Count the happy faces 😊 and discover what children like!</div>
    <div class="sp-card" id="sp"></div>
    <div class="sp-steps"><b>👀 Look</b><b>👆 Tap</b><b>🎉 Win</b></div>
    <button class="go-btn" id="startBtn">▶ Start</button>
    <div class="credit">designed by David Beleño - Math Education - 2026</div>
  </section>

  <section id="levels" class="screen">
    <div class="hdr"><button class="mini back" data-to="splash" aria-label="back">⬅️</button><div class="title">Choose your level</div></div>
    <div class="lvcards">
      <button class="lvcard" data-l="1"><span class="em">🌱</span>Level 1<small>Count and compare</small></button>
      <button class="lvcard" data-l="2"><span class="em">🚀</span>Level 2<small>Think and solve</small></button>
    </div>
  </section>

  <section id="menu" class="screen">
    <div class="hdr"><button class="mini back" data-to="levels" aria-label="back">⬅️</button><div class="title">Pick a topic</div><div class="lvb" id="menuLv"></div></div>
    <div class="themes" id="themes"></div>
  </section>

  <section id="game" class="screen">
    <div id="top">
      <button class="mini" id="home" aria-label="menu">🏠</button>
      <div id="prompt"></div>
      <button class="mini" id="say" aria-label="read aloud">🔊</button>
    </div>
    <div id="bar"><div id="dots"></div><div id="hud" class="hud"></div></div>
    <div id="stage"><div id="cols"></div></div>
    <div id="bottom"></div>
  </section>

  <section id="end" class="screen">
    <div class="big" id="endEm">🎉</div>
    <div class="score" id="endScore"></div>
    <div id="endHud" class="hud big"></div>
    <div id="endDots" style="display:flex;gap:1.2vmin"></div>
    <div class="btns">
      <button class="btn g" id="again">▶️</button>
      <button class="btn" id="next" style="background:#ffd23f">🚀 Level 2</button>
      <button class="btn" id="toMenu">🏠</button>
    </div>
  </section>

  <div id="fb"><div></div></div>
</div>

<script>
const FACE='😊';
const THEMES=[
 {id:'fruit',name:'Fruits',em:'🍎',title:'Favorite fruit',c:['#ff9a9e','#fecfef'],items:[['🍎','apples'],['🍐','pears'],['🍌','bananas'],['🍇','grapes'],['🍊','oranges']]},
 {id:'food',name:'Food',em:'🍕',title:'Favorite food',c:['#f6d365','#fda085'],items:[['🍕','pizza'],['🍔','burgers'],['🌭','hot dogs'],['🍦','ice cream'],['🍟','fries']]},
 {id:'place',name:'Places',em:'🏫',title:'Favorite place',c:['#43e97b','#38f9d7'],items:[['🏫','school'],['🌳','the park','park'],['🏖️','the beach','beach'],['🎡','the fair','fair'],['🏠','home']]},
 {id:'pet',name:'Pets',em:'🐶',title:'Favorite pet',c:['#a18cd1','#fbc2eb'],items:[['🐶','dogs'],['🐱','cats'],['🐰','rabbits'],['🐦','birds'],['🐠','fish']]},
 {id:'subject',name:'Class',em:'📚',title:'Favorite subject',c:['#a1c4fd','#c2e9fb'],items:[['🔢','math'],['🎨','art'],['📖','reading'],['🔬','science'],['🎵','music']]},
 {id:'sport',name:'Games',em:'⚽',title:'Favorite game',c:['#4facfe','#00c6ff'],items:[['⚽','soccer'],['🏀','basketball'],['🏊','swimming'],['🚲','biking'],['🎮','video games','video games']]},
 {id:'zoo',name:'Zoo',em:'🦁',title:'Favorite zoo animal',c:['#f9d423','#ff4e50'],items:[['🐘','elephants'],['🦒','giraffes'],['🐒','monkeys'],['🦁','lions'],['🐧','penguins']]},
 {id:'color',name:'Colors',em:'🌈',title:'Favorite color',c:['#fbc2eb','#a6c1ee'],items:[['🔴','red'],['🔵','blue'],['🟢','green'],['🟡','yellow'],['🟣','purple']]},
 {id:'weather',name:'Weather',em:'⛅',title:'Favorite weather',c:['#89f7fe','#66a6ff'],items:[['☀️','sunny','sunny days'],['🌧️','rainy','rainy days'],['❄️','snowy','snowy days'],['⛅','cloudy','cloudy days'],['🌈','rainbow','rainbows']]},
 {id:'toy',name:'Toys',em:'🧸',title:'Favorite toy',c:['#ffecd2','#fcb69f'],items:[['🧸','teddies','teddy bears'],['🚗','cars','toy cars'],['🪁','kites'],['🧩','puzzles'],['🎲','games','board games']]},
 {id:'ride',name:'Rides',em:'🚌',title:'Favorite ride',c:['#c3cfe2','#8fd3f4'],items:[['🚕','taxis'],['🚌','buses'],['🚲','bikes'],['🚂','trains'],['✈️','planes']]},
 {id:'drink',name:'Drinks',em:'🧃',title:'Favorite drink',c:['#84fab0','#8fd3f4'],items:[['🥛','milk'],['🧃','juice'],['💧','water'],['🍋','lemonade'],['🥥','coconut']]}
];
const TAGC=['#e63946','#1d7fb8','#2a9d5c','#e08a00'];
const PLANS={
 1:[['count'],['count'],['most'],['build1'],['total'],['least'],['complete'],['compare'],['build2'],['count',2],['compare'],['complete']],
 2:[['count',2],['all'],['whichmore'],['plus'],['notlike'],['buildmore'],['compare',2],['double'],['fillall'],['count',5],['all',2],['buildmore']]
};
let PLAN=PLANS[1],level=1;const N=12;

const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);

/* ---------- sound & voice ---------- */
let ac;
function tone(f,d=.12,type='sine',v=.14,when=0){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  const s=ac.currentTime+when;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}
}
const sfxOk=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,i*.09));
const sfxBig=()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.2,'triangle',.16,i*.08));
const sfxBad=()=>{tone(220,.18,'square',.08);tone(170,.22,'square',.08,.12)};
const sfxTick=n=>tone(380+n*55,.12,'triangle',.15);
const sfxPop=()=>tone(700,.07,'sine',.12);
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

/* ---------- round generation ---------- */
let theme,rounds,i,results,locked,tries,countTimer,pts,streak;

function makeCols(n,maxv){
  const items=shuf(theme.items).slice(0,n),vals=shuf(range(1,maxv)).slice(0,n);
  return items.map((it,k)=>({e:it[0],l:it[1],p:it[2]||it[1],n:vals[k],cur:vals[k],edit:false}));
}
function options(ans,step,extra){
  const s=new Set([ans]);
  (extra||[]).forEach(x=>{if(x>0&&s.size<3)s.add(x)});
  let g=0;
  while(s.size<3&&g++<80){const d=ans+(rnd(2)?1:-1)*step*(1+rnd(2));if(d>0)s.add(d)}
  return shuf([...s]);
}
const em=e=>`<b class="em">${e}</b>`;
function make(p,s){
  const L=level,sc=s||1,r={p,scale:sc,rows:4,hot:[],edit:[]};
  const mv=L===2?(sc>1?6:7):5, nc=(L===2||sc>1)?4:3;
  const say0=sc>1?`Each face is ${sc} children. `:'';
  const sum=cs=>cs.reduce((t,c)=>t+c.n,0);
  if(p==='count'){r.cols=makeCols(nc,mv);const a=rnd(nc);r.hot=[a];r.ans=r.cols[a].n*sc;r.opts=options(r.ans,sc,sc>1?[r.cols[a].n]:[]);
    r.html=`How many children like ${em(r.cols[a].e)}?`;r.say=say0+`How many children like ${r.cols[a].p}?`;r.tapcount=true}
  if(p==='most'||p==='least'){const most=p==='most';r.cols=makeCols(most?3:4,most?5:6);
    let k=0;r.cols.forEach((c,x)=>{if(most?c.n>r.cols[k].n:c.n<r.cols[k].n)k=x});r.ans=k;
    r.html=`Tap what <span class="hl">${most?'MOST':'LEAST'}</span> children like 👆`;r.say=`Tap the one that ${most?'most':'fewest'} children like.`;r.pickCol=true}
  if(p==='compare'){r.cols=makeCols(4,L===2?mv:6);let [a,b]=shuf(range(0,3)).slice(0,2);if(r.cols[a].n<r.cols[b].n)[a,b]=[b,a];
    const d=r.cols[a].n-r.cols[b].n;r.hot=[a,b];r.ans=d*sc;r.opts=options(r.ans,sc,sc>1?[d]:[]);
    r.html=`How many <span class="hl">MORE</span> children like ${em(r.cols[a].e)} than ${em(r.cols[b].e)}?`;
    r.say=say0+`How many more children like ${r.cols[a].p} than ${r.cols[b].p}?`;r.tapcount=true}
  if(p==='total'){r.cols=makeCols(3,mv);const [a,b]=shuf(range(0,2)).slice(0,2);r.hot=[a,b];r.ans=(r.cols[a].n+r.cols[b].n)*sc;r.opts=options(r.ans,sc,sc>1?[r.cols[a].n+r.cols[b].n]:[]);
    r.html=`How many children like ${em(r.cols[a].e)} <span class="hl">or</span> ${em(r.cols[b].e)}?`;
    r.say=say0+`How many children like ${r.cols[a].p} or ${r.cols[b].p}?`;r.tapcount=true}
  if(p==='all'){r.cols=makeCols(3,mv);const t=sum(r.cols);r.ans=t*sc;r.opts=options(r.ans,sc,sc>1?[t]:[]);
    r.html=`How many children in <span class="hl">ALL</span>? 👥`;r.say=say0+'How many children in all?';r.tapcount=true}
  if(p==='notlike'){r.cols=makeCols(3,mv);const a=rnd(3),t=sum(r.cols)-r.cols[a].n;r.hot=[a];r.ans=t*sc;r.opts=options(r.ans,sc,sc>1?[t]:[]);
    r.html=`How many children do <span class="hl">NOT</span> like ${em(r.cols[a].e)}?`;r.say=say0+`How many children do not like ${r.cols[a].p}?`;r.tapcount=true}
  if(p==='plus'){r.scale=1;r.cols=makeCols(3,7);const a=rnd(3),k=1+rnd(4);r.hot=[a];r.ans=r.cols[a].n+k;r.opts=options(r.ans,1);
    r.html=`<span class="hl">${k} more</span> children like ${em(r.cols[a].e)}. How many now?`;r.say=`${k} more children like ${r.cols[a].p}. How many children like ${r.cols[a].p} now?`;r.tapcount=true}
  if(p==='whichmore'){let cols,a,b,k,g=0;
    do{cols=makeCols(4,7);b=rnd(4);k=1+rnd(3);a=cols.findIndex(c=>c.n===cols[b].n+k)}while(a<0&&g++<200);
    if(a<0){cols=makeCols(4,7);cols[0].n=cols[1].n+1;a=0;b=1}
    r.cols=cols;cols.forEach(c=>c.cur=c.n);r.hot=[b];r.ans=a;r.pickCol=true;
    r.html=`Tap the one with <span class="hl">${k} MORE</span> than ${em(cols[b].e)} 👆`;r.say=`Tap the one with ${k} more than ${cols[b].p}.`}
  if(p==='double'){const k=1+rnd(3),others=shuf(range(1,7).filter(x=>x!==k&&x!==2*k)).slice(0,2),vals=shuf([k,2*k,...others]);
    const items=shuf(theme.items).slice(0,4);r.cols=items.map((it,x)=>({e:it[0],l:it[1],p:it[2]||it[1],n:vals[x],cur:vals[x],edit:false}));
    const a=vals.indexOf(2*k),b=vals.indexOf(k);r.hot=[b];r.ans=a;r.pickCol=true;
    r.html=`Tap the <span class="hl">DOUBLE</span> of ${em(r.cols[b].e)} (×2) 👆`;r.say=`Tap the double of ${r.cols[b].p}. Double means two times.`}
  if(p==='buildmore'){r.rows=6;r.cols=makeCols(3,5);const [a,b]=shuf(range(0,2)).slice(0,2);
    let more=rnd(2)===0;if(r.cols[b].n<2)more=true;const k=more?1+rnd(Math.min(3,7-r.cols[b].n)):1+rnd(Math.min(3,r.cols[b].n-1));
    const t=more?r.cols[b].n+k:r.cols[b].n-k;r.edit=[a];r.hot=[a];r.cols[a].n=t;r.cols[a].cur=0;r.cols[a].edit=true;r.build=true;
    r.html=`${em(r.cols[a].e)} has <span class="hl">${k} ${more?'MORE':'LESS'}</span> than ${em(r.cols[b].e)}<small>Build the ${r.cols[a].e} column</small>`;
    r.say=`${r.cols[a].p} has ${k} ${more?'more':'less'} than ${r.cols[b].p}. Build the column. Then press the green button.`}
  if(p==='fillall'){r.rows=6;r.cols=makeCols(3,6);const e=rnd(3),t=2+rnd(5);
    const total=sum(r.cols)-r.cols[e].n+t;r.edit=[e];r.hot=[e];r.cols[e].n=t;r.cols[e].cur=0;r.cols[e].edit=true;r.build=true;
    r.html=`<span class="num">${total}</span> children in all<small>Fill the empty column</small>`;
    r.say=`${total} children in all. Fill the empty column. Then press the green button.`}
  if(p==='build1'||p==='build2'){const two=p==='build2';r.rows=6;r.cols=makeCols(3,5);
    const ed=shuf(range(0,2)).slice(0,two?2:1);r.edit=ed;r.hot=ed;
    ed.forEach(k=>{r.cols[k].n=2+rnd(5);r.cols[k].cur=0;r.cols[k].edit=true});
    r.html=ed.map(k=>`<span class="line"><span class="num">${r.cols[k].n}</span> children like ${em(r.cols[k].e)}</span>`).join('');
    r.two=two;
    r.say='Make the pictogram. '+ed.map(k=>r.cols[k].n+' children like '+r.cols[k].p+'.').join(' ')+' Then press the green button.';r.build=true}
  if(p==='complete'){r.rows=6;r.cols=makeCols(3,5);const k=rnd(3),t=3+rnd(4);
    r.edit=[k];r.hot=[k];r.cols[k].n=t;r.cols[k].cur=1+rnd(t-2);r.cols[k].edit=true;
    r.html=`<span class="num">${t}</span> children like ${em(r.cols[k].e)}<small>Add ${FACE} to match!</small>`;
    r.say=`${t} children like ${r.cols[k].p}. Add faces to match. Then press the green button.`;r.build=true}
  r.rows=r.build?Math.max(r.rows,...r.cols.map(c=>c.n)):Math.max(4,...r.cols.map(c=>c.n));
  return r;
}

/* ---------- rendering ---------- */
function start(t){
  theme=t;document.documentElement.style.setProperty('--bg1',t.c[0]);document.documentElement.style.setProperty('--bg2',t.c[1]);
  i=0;results=[];rounds=null;pts={f:0,s:0,h:0};streak=0;show('game');
  PLAN=PLANS[level];rounds=[];for(let k=0;k<N;k++){i=k;rounds.push(make(PLAN[k][0],PLAN[k][1]))}
  i=0;render();
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.speechSynthesis&&speechSynthesis.cancel();
  if(id!=='game'&&id!=='end'){const c=id==='splash'?['#6a5cff','#ff8ad8']:['#4facfe','#00c6ff'];
    document.documentElement.style.setProperty('--bg1',c[0]);document.documentElement.style.setProperty('--bg2',c[1])}
  if(id==='splash')splashPicto();
}
function splashPicto(){
  const data=[['🍎',3,'#e63946'],['🍌',5,'#e08a00'],['🍇',2,'#7b2cbf']];
  $('#sp').innerHTML=data.map(([e,n,c],k)=>`<div class="spc"><div class="spb">${Array.from({length:n},(_,j)=>`<span style="animation-delay:${(k*.45+j*.3).toFixed(2)}s">😊</span>`).join('')}</div><div class="spt" style="background:${c}">${e}</div></div>`).join('');
}
setInterval(()=>{if($('#splash').classList.contains('on'))splashPicto()},5200);
(function(){const set=['😊','⭐','❤️','🍎','🎈','🌈','📊','🐶','🚀','🍕'];const sp=$('#splash');
  for(let k=0;k<16;k++){const d=document.createElement('div');d.className='drift';d.textContent=set[k%set.length];
    d.style.left=(3+k*6)%96+'%';d.style.fontSize=(5+rnd(6))+'vmin';d.style.animationDuration=(9+rnd(9))+'s';d.style.animationDelay=(-rnd(14))+'s';sp.appendChild(d)}})();
function drawDots(){
  $('#dots').innerHTML=`<div class="lvb">${level===1?'🌱':'🚀'} ${level}</div>`+range(0,N-1).map(k=>`<div class="dot ${k<results.length?(results[k]?'ok':'retry'):(k===i?'now':'')}"></div>`).join('');
  hud($('#hud'));
}
function hud(el,bump){
  el.innerHTML=`<span>${FACE} <span class="${bump==='f'?'b':''}">${pts.f}</span></span><span>⭐ <span class="${bump==='s'?'b':''}">${pts.s}</span></span><span>❤️ <span class="${bump==='h'?'b':''}">${pts.h}</span></span>`;
}
function render(){
  const r=rounds[i];locked=false;tries=0;clearTimeout(countTimer);
  const P=$('#prompt');P.className=r.two?'two':'';
  P.innerHTML=r.html+(i<2&&r.tapcount?'<small>👆 tap a column to count</small>':'');
  const key=`<div class="key">${FACE} = ${r.scale} ${r.scale>1?'children':'child'}</div>`;
  const hintBuild=(r.build&&PLAN.findIndex(x=>x[0]===r.p)===i)?`<div class="hint">👆 tap the circles</div>`:'';
  $('#stage').innerHTML=`<div id="shead"><div class="ptitle">📊 ${theme.title}</div>${hintBuild}${key}</div><div id="cols"></div>`;
  $('#cols').style.gridTemplateColumns=`repeat(${r.cols.length},1fr)`;
  r.cols.forEach((c,k)=>{
    const el=document.createElement('div');
    el.className='col'+(r.hot.includes(k)&&!r.build?' hot':'')+(c.edit?' edit':'')+(r.pickCol?' pick':'');
    el.dataset.k=k;
    el.innerHTML=`${r.build?`<div class="bslot">${c.edit?`<div class="bubble">${c.cur}</div>`:''}</div>`:''}<div class="body" style="--rows:${r.rows}"></div><div class="base"></div><div class="tag" style="background:${TAGC[k%4]}"><span style="font-size:1.45em;vertical-align:-.1em">${c.e}</span> ${c.l}</div>`;
    $('#cols').appendChild(el);fillCol(k);
  });
  /* answers */
  const b=$('#bottom');b.innerHTML='';
  if(r.opts)r.opts.forEach(v=>{const x=document.createElement('button');x.className='ans';x.textContent=v;x.onclick=()=>chooseNum(x,v);b.appendChild(x)});
  if(r.build){const x=document.createElement('button');x.className='ans go';x.textContent='✔️';x.onclick=checkBuild;b.appendChild(x)}
  drawDots();
}
function fillCol(k){
  const r=rounds[i],c=r.cols[k],body=document.querySelector(`.col[data-k="${k}"] .body`);
  let h='';
  for(let j=1;j<=r.rows;j++){
    if(j<=c.cur)h+=`<div class="cell full" data-j="${j}"><span>${FACE}</span></div>`;
    else if(c.edit)h+=`<div class="cell slot" data-j="${j}"></div>`;
    else h+=`<div class="cell"></div>`;
  }
  body.innerHTML=h;
  const bub=document.querySelector(`.col[data-k="${k}"] .bubble`);if(bub)bub.textContent=c.cur;
}

/* ---------- interaction ---------- */
$('#stage').addEventListener('click',e=>{
  if(locked)return;const r=rounds[i];
  const colEl=e.target.closest('.col');if(!colEl)return;const k=+colEl.dataset.k;
  if(r.build){
    const cell=e.target.closest('.cell.slot, .cell.full');if(!cell||!r.edit.includes(k))return;
    const j=+cell.dataset.j,c=r.cols[k];c.cur=(j===c.cur)?j-1:j;sfxPop();fillCol(k);return;
  }
  if(r.pickCol){
    if(k===r.ans)return right();
    colEl.classList.add('wrong','shake');sfxBad();tries++;setTimeout(()=>colEl.classList.remove('shake'),400);colEl.style.pointerEvents='none';colEl.classList.add('dim');return;
  }
  if(r.tapcount)countUp(k);
});
function countUp(k){
  const r=rounds[i],c=r.cols[k];clearTimeout(countTimer);
  document.querySelectorAll('.cell i').forEach(x=>x.remove());
  const cells=[...document.querySelectorAll(`.col[data-k="${k}"] .cell.full`)];
  cells.forEach((cell,j)=>setTimeout(()=>{if(!cell.isConnected)return;const n=document.createElement('i');n.textContent=(j+1)*r.scale;cell.appendChild(n);sfxTick(j)},j*380));
  countTimer=setTimeout(()=>document.querySelectorAll('.cell i').forEach(x=>x.remove()),cells.length*380+2500);
}
function chooseNum(btn,v){
  if(locked)return;const r=rounds[i];
  if(v===r.ans)return right();
  btn.disabled=true;btn.classList.add('shake');sfxBad();tries++;
}
function checkBuild(){
  if(locked)return;const r=rounds[i];
  const ok=r.edit.every(k=>r.cols[k].cur===r.cols[k].n);
  if(ok)return right();
  tries++;sfxBad();const g=$('.ans.go');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
  r.edit.forEach(k=>{const el=document.querySelector(`.col[data-k="${k}"]`);if(r.cols[k].cur!==r.cols[k].n){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),700)}});
}
function right(){
  locked=true;const first=(tries===0);results[i]=first;
  const gains=[];pts.f++;gains.push('f');
  if(first){pts.s++;gains.push('s');streak++;if(streak%3===0){pts.h++;gains.push('h')}}else streak=0;
  first?(gains.includes('h')?sfxBig():sfxOk()):sfxOk();
  drawDots();confetti(first?1:.5);
  const sym={f:FACE,s:'⭐',h:'❤️'};
  gains.forEach((g,k)=>setTimeout(()=>{const x=document.createElement('div');x.className='gain';x.textContent='+'+sym[g];
    x.style.left=(30+k*20+rnd(8))+'vw';x.style.top='45vh';document.body.appendChild(x);setTimeout(()=>x.remove(),1300);hud($('#hud'),g)},k*220));
  const W=first?['Great!','Super!','Wow!','Bravo!','Amazing!']:['Good!','Yes!','Nice!'];
  $('#fb div').innerHTML=`${W[rnd(W.length)]}<div style="font-size:.5em;margin-top:.1em">${gains.map(g=>sym[g]).join(' ')}</div>`;
  $('#fb').classList.add('on');
  setTimeout(()=>{$('#fb').classList.remove('on');i++;if(i>=N)finish();else render()},1250);
}
function confetti(f=1){
  const set=[FACE,'⭐','❤️',FACE,'🎉',theme.em,'🌈'];
  for(let k=0;k<Math.round(26*f);k++){const s=document.createElement('div');s.className='fall';s.textContent=set[rnd(set.length)];
    s.style.left=rnd(96)+'vw';s.style.animationDelay=(Math.random()*.5)+'s';s.style.fontSize=(4+rnd(5))+'vmin';document.body.appendChild(s);setTimeout(()=>s.remove(),2400)}
}
function finish(){
  const good=results.filter(Boolean).length;
  show('end');$('#next').style.display=level===1?'':'none';$('#endEm').textContent=good>=10?'🏆':good>=6?'🎉':'💪';
  $('#endScore').textContent=good>=10?'Champion!':good>=6?'Great job!':'Good try!';
  hud($('#endHud'),'f');
  $('#endDots').innerHTML=results.map(v=>`<div class="dot ${v?'ok':'retry'}"></div>`).join('');
  sfxBig();confetti(2);setTimeout(()=>confetti(2),900);setTimeout(()=>confetti(2),1800);
}

/* ---------- wiring ---------- */
$('#themes').innerHTML=THEMES.map((t,k)=>`<button class="theme" data-k="${k}"><span class="em">${t.em}</span>${t.name}</button>`).join('');
$('#themes').addEventListener('click',e=>{const b=e.target.closest('.theme');if(b){tone(600,.1);start(THEMES[+b.dataset.k])}});
$('#home').onclick=()=>show('levels');
$('#toMenu').onclick=()=>$('#home').onclick();
$('#again').onclick=()=>start(theme);
$('#next').onclick=()=>{level=2;start(theme)};
$('#startBtn').onclick=()=>{tone(600,.1);tone(800,.12,'sine',.14,.1);show('levels')};
document.querySelectorAll('.lvcard').forEach(b=>b.onclick=()=>{level=+b.dataset.l;tone(600,.1);$('#menuLv').textContent=(level===1?'🌱':'🚀')+' '+level;show('menu')});
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>show(b.dataset.to));
show('splash');
$('#say').onclick=()=>speak(rounds[i].say);
</script>
</body>
